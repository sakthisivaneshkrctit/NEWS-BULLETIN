<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate News Bulletin UI with Video & Pause</title>
    <style>
        :root {
            --news-red: #e63946;
            --news-blue: #001d3d;
            --accent-yellow: #ffc300;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        body { background: #000; color: white; overflow: hidden; height: 100vh; }

        /* --- CONTROLS PANEL (Top Right) --- */
        .controls-panel {
            position: fixed; top: 15px; right: 20px; z-index: 1000;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px;
            display: none; border: 2px solid var(--news-red);
            text-align: center; box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
        }
        
        .btn {
            color: white; border: none; padding: 10px 15px; cursor: pointer; 
            font-weight: bold; border-radius: 4px; font-size: 1rem; transition: 0.3s;
            margin: 0 5px;
        }
        
        .rec-btn { background: var(--news-red); }
        .rec-btn.recording { background: #ffffff; color: #e63946; animation: pulseRecord 1.5s infinite; }
        .pause-btn { background: #444; }
        .pause-btn:hover { background: #666; }

        #status { display: block; margin-top: 8px; font-size: 0.8rem; font-family: sans-serif; color: #ccc;}

        @keyframes pulseRecord {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
            50% { transform: scale(1.05); box-shadow: 0 0 10px 10px rgba(230, 57, 70, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
        }

        /* --- SETUP SCREEN --- */
        #setup-screen {
            position: fixed; width: 100%; height: 100%;
            background: #001d3d; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; padding: 20px;
            overflow-y: auto;
        }
        .input-container {
            background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 15px;
            width: 100%; max-width: 800px; border: 1px solid rgba(255,255,255,0.2);
            margin-top: 50px;
        }
        label { font-family: sans-serif; color: var(--accent-yellow); font-weight: bold; display: block; margin-bottom: 5px; margin-top: 15px; }
        textarea {
            width: 100%; height: 100px; background: #000; border: 1px solid #444;
            color: white; padding: 15px; font-family: sans-serif; font-size: 1.1rem; border-radius: 5px;
        }
        input[type="file"] {
            display: block; width: 100%; padding: 10px; background: #000; color: white;
            border: 1px solid #444; border-radius: 5px; font-family: sans-serif;
        }

        /* --- BROADCAST UI --- */
        #broadcast-ui { display: none; position: relative; width: 100vw; height: 100vh; background: #000; }
        #capture-area { width: 100%; height: 100%; position: relative; overflow: hidden; background: #000; }

        /* Background Video */
        #bg-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 0; opacity: 0.8;
        }

        /* Graphics */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .logo { position: absolute; top: 40px; left: 50px; background: var(--news-red); padding: 10px 25px; font-size: 1.8rem; }
        .main-box { position: absolute; bottom: 150px; left: 50px; width: 80%; transition: opacity 0.5s ease-in-out; }
        .headline-frame { background: white; color: black; padding: 30px; border-left: 15px solid var(--news-red); box-shadow: 10px 10px 20px rgba(0,0,0,0.8); }
        #main-title { font-size: 3.5rem; text-transform: uppercase; margin-bottom: 10px; line-height: 1.1; }
        #main-desc { font-size: 1.4rem; font-family: sans-serif; font-weight: normal; }

        /* Ticker */
        .ticker-wrap { position: absolute; bottom: 0; width: 100%; height: 70px; background: #000; display: flex; align-items: center; border-top: 4px solid var(--news-red); }
        .ticker-label { background: var(--news-red); height: 100%; padding: 0 20px; display: flex; align-items: center; z-index: 10; font-size: 1.2rem; }
        .ticker-text { white-space: nowrap; font-size: 1.8rem; font-family: sans-serif; font-weight: bold; animation: scroll 30s linear infinite; padding-left: 100%; }

        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="controls-panel" id="controlsPanel">
        <button id="pauseBtn" class="btn pause-btn" onclick="togglePause()">⏸ PAUSE</button>
        <button id="recordBtn" class="btn rec-btn" onclick="toggleRecording()">🔴 REC</button>
        <span id="status">Status: Ready</span>
    </div>

    <div id="setup-screen">
        <div class="input-container">
            <h2 style="color: white; text-align: center;">STUDIO SETUP</h2>
            
            <label>BACKGROUND VIDEO (Optional: Select MP4/WebM)</label>
            <input type="file" id="videoInput" accept="video/*">

            <label>MAIN HEADLINES (Double Enter to separate)</label>
            <textarea id="mainInput">AI REVOLUTION CONTINUES
Artificial Intelligence is now reaching human-level capabilities in creative tasks.

TECH JOBS BOOMING
New sectors in prompt engineering and AI ethics are creating thousands of jobs.</textarea>
            
            <label>BOTTOM TICKER (Full text)</label>
            <textarea id="tickerInput">BREAKING NEWS: Global tech markets reach all-time high... New AI regulations announced... Future of robotics looks bright...</textarea>
            
            <button style="width:100%; margin-top:20px; padding:18px; background:var(--news-red); color:white; border:none; cursor:pointer; font-size: 1.2rem; border-radius: 5px; font-weight: bold;" onclick="launch()">START BROADCAST</button>
        </div>
    </div>

    <div id="broadcast-ui">
        <div id="capture-area">
            <video id="bg-video" loop muted playsinline></video>
            
            <div class="ui-layer">
                <div class="logo">SAKTHI TECH</div>
                <div class="main-box" id="mainBox">
                    <div style="background:var(--accent-yellow); color:black; display:inline-block; padding:5px 15px; margin-bottom: 5px;">BREAKING</div>
                    <div class="headline-frame">
                        <h1 id="main-title">LOADING...</h1>
                        <p id="main-desc">Please wait...</p>
                    </div>
                </div>
                <div class="ticker-wrap">
                    <div class="ticker-label">LATEST</div>
                    <div class="ticker-text" id="ticker-out"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- GLOBALS ---
        let slides = [];
        let index = 0;
        let rotationInterval;
        let isPaused = false;

        // --- LAUNCH LOGIC ---
        function launch() {
            const main = document.getElementById('mainInput').value.trim();
            const tick = document.getElementById('tickerInput').value.trim();
            const videoFile = document.getElementById('videoInput').files[0];

            if (!main || !tick) return alert("Please fill in the text fields!");

            // Load Background Video if provided
            const bgVideo = document.getElementById('bg-video');
            if (videoFile) {
                const fileURL = URL.createObjectURL(videoFile);
                bgVideo.src = fileURL;
                bgVideo.play();
            } else {
                // Default fallback background if no video selected
                bgVideo.style.background = "radial-gradient(circle, #003566, #000)";
            }

            // Parse text
            slides = main.split(/\n\n/).map(c => {
                const lines = c.split('\n');
                return { h: lines[0] || "", d: lines.slice(1).join(' ') || "" };
            });

            document.getElementById('ticker-out').innerText = tick + "   •   " + tick + "   •   " + tick;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('broadcast-ui').style.display = 'block';
            document.getElementById('controlsPanel').style.display = 'block';

            rotate();
            rotationInterval = setInterval(rotate, 6000);
        }

        // --- NEWS ROTATION ---
        function rotate() {
            if (isPaused) return; // Don't rotate if paused
            
            const box = document.getElementById('mainBox');
            box.style.opacity = 0; 
            
            setTimeout(() => {
                document.getElementById('main-title').innerText = slides[index].h;
                document.getElementById('main-desc').innerText = slides[index].d;
                box.style.opacity = 1; 
                index = (index + 1) % slides.length;
            }, 500);
        }

        // --- PAUSE/PLAY LOGIC ---
        function togglePause() {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            const ticker = document.getElementById('ticker-out');
            const bgVideo = document.getElementById('bg-video');

            if (isPaused) {
                pauseBtn.innerText = "▶️ PLAY";
                ticker.style.animationPlayState = 'paused';
                if (bgVideo.src) bgVideo.pause();
                clearInterval(rotationInterval);
            } else {
                pauseBtn.innerText = "⏸ PAUSE";
                ticker.style.animationPlayState = 'running';
                if (bgVideo.src) bgVideo.play();
                rotationInterval = setInterval(rotate, 6000);
            }
        }

        // --- RECORDING LOGIC ---
        let mediaRecorder;
        let recordedChunks = [];
        let captureStream;

        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const status = document.getElementById('status');

            if (btn.innerText === "🔴 REC") {
                try {
                    // Ask user to share the tab
                    captureStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { frameRate: 30 }, audio: true 
                    });

                    let options = { mimeType: 'video/webm; codecs=vp9' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/webm' }; 
                    }

                    mediaRecorder = new MediaRecorder(captureStream, options);
                    recordedChunks = [];

                    mediaRecorder.ondataavailable = function(e) {
                        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = function() {
                        saveVideo();
                        captureStream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start(100);

                    btn.innerText = "⏹ STOP";
                    btn.classList.add('recording');
                    status.innerText = "Status: 🔴 RECORDING...";
                    status.style.color = "#ff4d5a";

                } catch (err) {
                    console.error("Screen capture error: ", err);
                    status.innerText = "Status: Recording cancelled.";
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
                btn.innerText = "🔴 REC";
                btn.classList.remove('recording');
                status.innerText = "Status: Saving video...";
                status.style.color = "#ccc";
            }
        }

        function saveVideo() {
            if (recordedChunks.length === 0) return alert("No video data was captured!");
            
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement('a');
            document.body.appendChild(a); 
            a.style.display = 'none';
            a.href = url;
            a.download = `Studio_Broadcast_${Date.now()}.webm`; 
            a.click();

            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                document.getElementById('status').innerText = "Status: ✅ Saved!";
                document.getElementById('status').style.color = "#00ff00";
            }, 100);
        }
    </script>
</body>
</html>
